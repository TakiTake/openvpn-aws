name: release
on:
  push:
    branches: [main] # auto-release when versions.env is ahead of the last tag
    tags: ["v*"] # manual escape hatch: push a tag to (re)build a release
# A GITHUB_TOKEN tag push does not trigger workflows (anti-recursion), so the
# main-push path cannot delegate to the tag path — it creates tag + release
# itself via `gh release create`. Serialize runs so build numbers can't race.
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15 # arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tag history is needed to compute the build number
      - name: Resolve tag
        id: tag
        run: |
          set -o pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Push to main: release v<openvpn>-<n> only if versions.env moved
          # since the newest tag of this OpenVPN version. n=0 for a new
          # OpenVPN version, otherwise last+1 (OpenSSL-only rebuilds).
          source ./versions.env
          prefix="v${OPENVPN_VERSION}-"
          last="$(git tag -l "${prefix}*" --sort=-v:refname | head -1)"
          if [ -n "$last" ] && git diff --quiet "$last" "$GITHUB_SHA" -- versions.env; then
            echo "versions.env unchanged since ${last}; nothing to release"
            echo "tag=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          n=0
          [ -n "$last" ] && n=$(( ${last##*-} + 1 ))
          echo "releasing ${prefix}${n}"
          echo "tag=${prefix}${n}" >>"$GITHUB_OUTPUT"
      - name: Install build deps
        if: steps.tag.outputs.tag != ''
        run: brew install pkgconf openssl@3
      - name: Build and verify
        if: steps.tag.outputs.tag != ''
        run: TAG="${{ steps.tag.outputs.tag }}" ./build.sh
      - name: Create release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "$(printf 'Patched OpenVPN for AWS Client VPN SAML federation (see README).\n\n%s\n\n```\n%s\n```' "$(cat dist/BUILDINFO)" "$(cat dist/SHA256SUMS)")" \
            dist/openvpn-aws-*.tar.gz \
            dist/openvpn-aws-*.tar.gz.sha256
